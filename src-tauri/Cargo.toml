[package]
name = "ff-mediatool"
version = "0.1.0"
description = "FF-MediaTool - FFmpeg based local audio/video processing desktop tool"
authors = ["Mingri"]
edition = "2021"

[lib]
name = "ff_mediatool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
which = "7"
sysinfo = "0.39.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Performance"] }
